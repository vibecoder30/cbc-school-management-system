{% extends "base.html" %}
{% block title %}Register School – CBC SMS{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow border-0">
      <div class="card-header bg-success text-white">
        <h4 class="mb-0"><i class="bi bi-building-add me-2"></i>Register Your School</h4>
      </div>
      <div class="card-body p-4">
        <p class="text-muted">Once you submit, the system creates your school and generates admin login credentials instantly.</p>
        <form method="post">
          <h5 class="text-success mt-2">School Details</h5>
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label">School Name *</label>
              <input type="text" name="name" class="form-control" required placeholder="e.g. Green Valley Academy">
            </div>
            <div class="col-md-4">
              <label class="form-label">County</label>
              <input type="text" name="county" class="form-control" placeholder="e.g. Nairobi">
            </div>
            <div class="col-md-4">
              <label class="form-label">Sub-County</label>
              <input type="text" name="sub_county" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Phone</label>
              <input type="text" name="phone" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">School Email</label>
              <input type="email" name="email" class="form-control">
            </div>
          </div>

          <h5 class="text-success mt-4">School Administrator</h5>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">First Name *</label>
              <input type="text" name="admin_first_name" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Last Name</label>
              <input type="text" name="admin_last_name" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Admin Email *</label>
              <input type="email" name="admin_email" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Admin Phone</label>
              <input type="text" name="admin_phone" class="form-control">
            </div>
          </div>

          <div class="mt-4 d-grid">
            <button type="submit" class="btn btn-cbc btn-lg">
              <i class="bi bi-check2-circle me-2"></i>Register & Get Instant Login
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
